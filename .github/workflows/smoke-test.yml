name: Smoke Test Go Plugin

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  TYK_VERSION: v5.11.0
  TYK_GW_SECRET: 352d20ee67be67f6340b4c0605b044b7

jobs:
  smoke-test:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21.8'

      # Build the plugin using the tyk-plugin-compiler
      - name: Build Go Plugin
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/go/src:/plugin-source \
            tykio/tyk-plugin-compiler:${{ env.TYK_VERSION }} \
            CustomGoPlugin.so

      - name: Move plugin to middleware dir
        run: |
          cp ./go/src/CustomGoPlugin*.so ./tyk/middleware/

      # Run the gateway on host network so it can reach the Redis service on localhost:6379
      - name: Start Tyk Gateway
        run: |
          docker run -d --name tyk-gateway \
            --network host \
            -v ${{ github.workspace }}/tyk/middleware:/opt/tyk-gateway/middleware \
            -e TYK_GW_LISTENPORT=8080 \
            -e TYK_GW_SECRET=${{ env.TYK_GW_SECRET }} \
            -e TYK_GW_STORAGE_TYPE=redis \
            -e TYK_GW_STORAGE_HOST=localhost \
            -e TYK_GW_STORAGE_PORT=6379 \
            -e TYK_GW_POLICIES_POLICYSOURCE=file \
            -e TYK_GW_USEDBAPPCONFIGS=false \
            -e TYK_GW_TEMPLATEPATH=./templates \
            -e TYK_GW_TYKJSPATH=./js/tyk.js \
            -e TYK_GW_MIDDLEWAREPATH=./middleware \
            -e TYK_GW_APPPATH=./apps/ \
            -e TYK_GW_ALLOWINSECURECONFIGS=true \
            tykio/tyk-gateway:${{ env.TYK_VERSION }}

      - name: Wait for Gateway to be ready
        run: |
          echo "Waiting for Tyk Gateway..."
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/hello 2>/dev/null || true)
            if [ "$STATUS" = "200" ] || [ "$STATUS" = "302" ]; then
              echo "Gateway is ready!"
              break
            fi
            if [ "$i" = "30" ]; then
              echo "Gateway failed to start"
              docker logs tyk-gateway 2>&1 | tail -30
              exit 1
            fi
            echo "Attempt $i/30 - status: $STATUS"
            sleep 2
          done

      # Verify Redis is connected by checking gateway logs
      - name: Verify Gateway startup
        run: |
          sleep 2
          docker logs tyk-gateway 2>&1 | grep -i "redis\|error\|API loaded\|Gateway started" || true

      # Create an API definition with the Go plugin as pre-middleware
      - name: Create API with Go Plugin
        run: |
          RESULT=$(curl -s -w "\n%{http_code}" -X POST http://localhost:8080/tyk/apis \
            --header "X-Tyk-Authorization: ${{ env.TYK_GW_SECRET }}" \
            --header "Content-Type: application/json" \
            --data '{
              "name": "httpbin-smoke-test",
              "slug": "httpbin-smoke-test",
              "use_keyless": true,
              "active": true,
              "proxy": {
                "target_url": "http://httpbin.org/",
                "listen_path": "/httpbin/",
                "strip_listen_path": true
              },
              "custom_middleware": {
                "pre": [
                  {
                    "name": "AddFooBarHeader",
                    "path": "/opt/tyk-gateway/middleware/CustomGoPlugin.so",
                    "require_session": false
                  }
                ],
                "driver": "goplugin"
              },
              "version_data": {
                "not_versioned": true,
                "versions": {
                  "Default": {
                    "name": "Default"
                  }
                }
              }
            }')
          HTTP_CODE=$(echo "$RESULT" | tail -1)
          BODY=$(echo "$RESULT" | head -n -1)
          echo "Create API response ($HTTP_CODE): $BODY"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Failed to create API"
            exit 1
          fi

      - name: Reload Gateway and wait for API to load
        run: |
          curl -s http://localhost:8080/tyk/reload \
            --header "X-Tyk-Authorization: ${{ env.TYK_GW_SECRET }}"
          sleep 5
          # Confirm the API was loaded
          docker logs tyk-gateway 2>&1 | tail -20

      # Smoke test: call the API and verify the plugin injected the header
      # httpbin.org/get echoes back all request headers in JSON
      - name: Smoke Test - Verify header injection
        run: |
          echo "Calling /httpbin/get to verify plugin header injection..."
          RESPONSE=$(curl -s http://localhost:8080/httpbin/get)
          echo "Response:"
          echo "$RESPONSE" | jq . || echo "$RESPONSE"

          # httpbin echoes headers back — check for our injected header
          if echo "$RESPONSE" | jq -e '.headers["X-Simpleheader-Inject"]' 2>/dev/null | grep -q "foo"; then
            echo "SUCCESS: X-SimpleHeader-Inject header was injected by the Go plugin!"
          else
            echo "FAILURE: X-SimpleHeader-Inject header not found in response"
            echo "Full response: $RESPONSE"
            exit 1
          fi

      - name: Gateway Logs (debug)
        if: always()
        run: docker logs tyk-gateway 2>&1 | tail -80
